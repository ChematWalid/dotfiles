[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
text = #cdd6f4
subtext0 = #a6adc8
subtext1 = #bac2de
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
overlay0 = #6c7086
overlay1 = #7f849c
overlay2 = #9399b2
blue = #89b4fa
lavender = #b4befe
sapphire = #74c7ec
sky = #89dceb
teal = #94e2d5
green = #a6e3a1
yellow = #f9e2af
peach = #fab387
maroon = #eba0ac
red = #f38ba8
mauve = #cba6f7
pink = #f5c2e7
flamingo = #f2cdcd
rosewater = #f5e0dc
transparent = #00000000

[bar/main]
width = 100%
height = 28pt
radius = 0
bottom = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt

border-size = 0pt
border-color = ${colors.transparent}

padding-left = 2
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "Noto Color Emoji:scale=10;2"

# Modules layout
modules-left = i3
modules-center = date
modules-right = pulseaudio memory cpu wlan eth tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-matching = true

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-default = 

format = <label-state> <label-mode>

label-focused = %index% %icon%
label-focused-foreground = ${colors.mauve}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.mauve}
label-focused-padding = 2

label-unfocused = %index% %icon%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding = 2

label-visible = %index% %icon%
label-visible-underline = ${colors.surface2}
label-visible-padding = 2

label-urgent = %index% %icon%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.text}

label-muted = "󰝟 Muted"
label-muted-foreground = ${colors.overlay0}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.yellow}
label = %used%
label-foreground = ${colors.text}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%
label-foreground = ${colors.text}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = 󰤨 %local_ip%
label-connected-foreground = ${colors.teal}
label-disconnected = 

[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󰈀 %local_ip%
label-connected-foreground = ${colors.green}
label-disconnected = 

[module/date]
type = internal/date
interval = 1
date = %a, %b %d  %H:%M:%S
format-prefix = "󰃰 "
format-prefix-foreground = ${colors.lavender}
label = %date%
label-foreground = ${colors.text}

[module/tray]
type = internal/tray
tray-size = 16px
tray-spacing = 6px
tray-background = ${colors.base}

[module/powermenu]
type = custom/text
format = " 󰐥 "
format-foreground = ${colors.red}
click-left = /home/walid/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
