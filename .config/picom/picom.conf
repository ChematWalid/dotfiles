# Picom compositor — merged: Catppuccin aesthetics + your NVIDIA GT 610 optimizations
# xrender backend kept for compatibility with GF119/Fermi cards
backend = "xrender";
vsync = true;

# Disabling use-damage fixes stuttering on old NVIDIA cards
use-damage = false;

# --- Opacity ---
active-opacity = 1.0;
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "94:class_g = 'kitty' && focused",
  "88:class_g = 'kitty' && !focused",
  "94:class_g = 'Alacritty' && focused",
  "88:class_g = 'Alacritty' && !focused",
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'firefox'",
  "95:class_g = 'Rofi'",
  "95:class_g = 'Dunst'"
];

# --- Fading (smoother transitions from vari-sh) ---
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -10;
shadow-offset-y = -10;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS"
];

# --- Corners (Only floating windows & dialogs are rounded) ---
corner-radius = 0;
corner-radius-rules = [
  "12:I3_FLOATING_WINDOW = 1",
  "12:window_type = 'dialog'",
  "12:window_type = 'notification'",
  "12:window_type = 'utility'",
  "12:window_type = 'splash'"
];
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Polybar'"
];

# --- Wintypes ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
