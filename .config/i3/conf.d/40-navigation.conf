# ── Core Window Navigation, Splits & Layouts ─────────────────────────────────
# Kill focused window
bindsym $mod+Shift+q kill
bindsym $mod+Shift+a kill
bindsym $mod+q kill
bindsym Mod1+F4 kill

# Change focus (Vim keys with Alt, Arrow keys with Super)
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym Mod4+Left focus left
bindsym Mod4+Down focus down
bindsym Mod4+Up focus up
bindsym Mod4+Right focus right

# Move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym Mod4+Shift+Left move left
bindsym Mod4+Shift+Down move down
bindsym Mod4+Shift+Up move up
bindsym Mod4+Shift+Right move right

# Split orientation
bindsym $mod+backslash split h
bindsym $mod+minus split v

# Polybar toggle on demand (Alt+F)
bindsym $mod+f exec --no-startup-id ~/.local/bin/toggle-polybar.sh

# Window Fullscreen toggle (Super+F & Alt+Shift+F)
bindsym Mod4+f fullscreen toggle
bindsym $mod+Shift+f fullscreen toggle

# Toggle floating / tiling (shrinks floating window to compact 960x600 centered)
bindsym $mod+Shift+space floating toggle; [con_id=__focused__] resize set 960 600, move position center
bindsym Mod4+Shift+space floating toggle; [con_id=__focused__] resize set 960 600, move position center

# Layout styles
bindsym $mod+z layout tabbed
bindsym $mod+x layout toggle split

# Reload / Restart i3
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

# Exit / Power
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'Exit i3?' -B 'Yes, exit' 'i3-msg exit'"
bindsym $mod+Shift+x exec bash ~/.local/bin/lock.sh
bindsym $mod+Shift+Control+x [con_on_workspace=current] kill
