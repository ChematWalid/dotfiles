# ── Autostart Applications & Daemons ──────────────────────────────────────────
exec --no-startup-id dex --autostart --environment i3
# Disable auto-locking on idle/screensaver:
# exec --no-startup-id xss-lock --transfer-sleep-lock -- ~/.local/bin/lock.sh
exec --no-startup-id nm-applet
exec --no-startup-id blueman-applet
# Import i3's active display credentials before starting X11 desktop services.
# i3 restart also safely starts any stopped services.
exec_always --no-startup-id sh -c 'systemctl --user import-environment DISPLAY XAUTHORITY; systemctl --user start picom.service copyq.service conky.service wallpaper-rotate.service autotiling.service'
exec --no-startup-id dunst
exec --no-startup-id env LC_ALL=en_US.UTF-8 flameshot
exec_always --no-startup-id ~/.config/polybar/launch.sh
exec --no-startup-id /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec_always --no-startup-id ~/.local/bin/apply-input-settings.sh
exec --no-startup-id xsettingsd -c ~/.config/xsettingsd/xsettingsd.conf
exec_always --no-startup-id xset s off -dpms s noblank
