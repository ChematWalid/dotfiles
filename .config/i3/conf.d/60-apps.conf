# ── Applications & Desktop Tools Keybindings ──────────────────────────────────
# Terminals
bindsym $mod+Return exec --no-startup-id kitty
bindsym $super+Return exec --no-startup-id alacritty

# Application Launcher (Rofi)
bindsym $mod+d exec --no-startup-id env QT_QPA_PLATFORMTHEME=xdgdesktopportal QT_STYLE_OVERRIDE=kvantum QT_USE_PORTAL=1 GTK_THEME=catppuccin-mocha-mauve-standard+default rofi -show drun -theme ~/.config/rofi/config.rasi
bindsym $mod+space exec --no-startup-id env QT_QPA_PLATFORMTHEME=xdgdesktopportal QT_STYLE_OVERRIDE=kvantum QT_USE_PORTAL=1 GTK_THEME=catppuccin-mocha-mauve-standard+default rofi -show drun -theme ~/.config/rofi/config.rasi
bindsym $mod+Tab exec --no-startup-id env QT_QPA_PLATFORMTHEME=xdgdesktopportal QT_STYLE_OVERRIDE=kvantum QT_USE_PORTAL=1 GTK_THEME=catppuccin-mocha-mauve-standard+default rofi -show window -theme ~/.config/rofi/config.rasi

# Screenshots
# Queue a direct root-window capture so transient app previews and menus can be
# opened before the frame is taken. Ctrl+Print gives especially slow previews
# more time to appear.
bindsym Print exec --no-startup-id ~/.local/bin/flameshot-safe.sh delay 10
bindsym Mod4+Shift+s exec --no-startup-id ~/.local/bin/flameshot-safe.sh gui
bindsym $mod+Shift+s exec --no-startup-id ~/.local/bin/flameshot-safe.sh gui
bindsym Mod4+Shift+x exec --no-startup-id ~/.local/bin/ocr-screenshot.sh
bindsym $mod+Shift+x exec --no-startup-id ~/.local/bin/ocr-screenshot.sh
bindsym Shift+Print exec --no-startup-id ~/.local/bin/flameshot-safe.sh full
# Longer queue for previews that need extra time to reopen after the key press.
bindsym Control+Print exec --no-startup-id ~/.local/bin/flameshot-safe.sh delay 15
bindsym Mod4+Print exec --no-startup-id ~/.local/bin/flameshot-safe.sh screen
bindsym $mod+Print exec --no-startup-id ~/.local/bin/flameshot-safe.sh screen

# Quick App Launchers
bindsym $mod+b exec --no-startup-id firefox
bindsym $mod+Shift+b exec --no-startup-id google-chrome-stable
bindsym $mod+e exec --no-startup-id thunar
bindsym $mod+t exec --no-startup-id ~/.local/bin/ayugram
bindsym $mod+c exec --no-startup-id code

# Lock Screen (Win+L & Alt+Ctrl+L)
bindsym Mod4+l exec --no-startup-id ~/.local/bin/lock.sh
bindsym $mod+Control+l exec --no-startup-id ~/.local/bin/lock.sh

# Bitwarden / Vaultwarden Password Auto-Typer (Win+P & Alt+P)
bindsym Mod4+p exec --no-startup-id rofi-rbw
bindsym $mod+p exec --no-startup-id rofi-rbw

# CopyQ Clipboard Manager (Alt+V & Win+V)
bindcode Mod1+55 exec --no-startup-id ~/.local/bin/toggle-copyq.sh
bindcode Mod4+55 exec --no-startup-id ~/.local/bin/toggle-copyq.sh

# Scratchpad Dropdown Terminal (Alt+U & Win+U)
bindsym $mod+u exec --no-startup-id ~/.local/bin/i3-layout-toggle scratchpad
bindsym Mod4+u exec --no-startup-id ~/.local/bin/i3-layout-toggle scratchpad

# Shazam Music Recognition (Alt+M & Win+M)
bindsym $mod+m exec --no-startup-id ~/.local/bin/shazam -q
bindsym Mod4+m exec --no-startup-id ~/.local/bin/shazam -q
bindsym $mod+Shift+m exec --no-startup-id ~/.local/bin/shazam --gui
bindsym Mod4+Shift+m exec --no-startup-id ~/.local/bin/shazam --gui

# Rofi Calculator (Alt+= & Win+C)
bindsym $mod+equal exec --no-startup-id "rofi -show calc -modi calc -no-show-match -no-sort -theme ~/.config/rofi/config.rasi"
bindsym Mod4+c exec --no-startup-id "rofi -show calc -modi calc -no-show-match -no-sort -theme ~/.config/rofi/config.rasi"

# Rofi Web Search (Alt+Shift+W & Win+W)
bindsym $mod+Shift+w exec --no-startup-id ~/.local/bin/rofi-websearch.sh
bindsym Mod4+w exec --no-startup-id ~/.local/bin/rofi-websearch.sh

# Smart Autotiling Toggle (Alt+Shift+T & Win+Shift+T)
bindsym $mod+Shift+t exec --no-startup-id ~/.local/bin/i3-layout-toggle autotiling-toggle
bindsym Mod4+Shift+t exec --no-startup-id ~/.local/bin/i3-layout-toggle autotiling-toggle

# Language / Keyboard Layout Switcher (Win+Space)
bindsym Mod4+space exec --no-startup-id ~/.local/bin/xkb-group-toggle toggle --notify

# Wallpaper — pick next random (Super+N)
bindsym Mod4+n exec --no-startup-id ~/.local/bin/wallpaper-manager next

# Notification Center & History (Win+` / Win+Shift+N)
bindsym Mod4+grave exec --no-startup-id ~/.local/bin/rofi-notification-center.sh
bindsym Mod4+Shift+n exec --no-startup-id ~/.local/bin/rofi-notification-center.sh
bindsym Mod4+Control+n exec --no-startup-id dunstctl history-pop
bindsym Mod4+Control+space exec --no-startup-id dunstctl close-all

# Window Information Notification (Alt+Shift+I / Super+I)
bindsym $mod+Shift+i exec --no-startup-id ~/.local/bin/i3-layout-toggle window-info
bindsym Mod4+i exec --no-startup-id ~/.local/bin/i3-layout-toggle window-info

# Bluetooth Device Manager (Super+B)
bindsym Mod4+b exec --no-startup-id "rofi-bluetooth -theme ~/.config/rofi/config.rasi"

# Floating Cava Audio Visualizer Toggle (Super+Shift+V & Alt+Shift+V)
bindsym Mod4+Shift+v exec --no-startup-id ~/.local/bin/toggle-cava.sh
bindsym $mod+Shift+v exec --no-startup-id ~/.local/bin/toggle-cava.sh

# Quick Scratchpad Memo (Super+Shift+O & Alt+Shift+O)
bindsym Mod4+Shift+o exec --no-startup-id ~/.local/bin/rofi-memo.sh
bindsym $mod+Shift+o exec --no-startup-id ~/.local/bin/rofi-memo.sh
