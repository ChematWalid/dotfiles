# ── Workspace Definitions & Navigation ────────────────────────────────────────
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# Switch to workspace using physical keycodes 10..19 (keys 1..0 on any layout: QWERTY/AZERTY/Arabic)
bindcode $mod+10 workspace number $ws1
bindcode $mod+11 workspace number $ws2
bindcode $mod+12 workspace number $ws3
bindcode $mod+13 workspace number $ws4
bindcode $mod+14 workspace number $ws5
bindcode $mod+15 workspace number $ws6
bindcode $mod+16 workspace number $ws7
bindcode $mod+17 workspace number $ws8
bindcode $mod+18 workspace number $ws9
bindcode $mod+19 workspace number $ws10

bindcode Mod4+10 workspace number $ws1
bindcode Mod4+11 workspace number $ws2
bindcode Mod4+12 workspace number $ws3
bindcode Mod4+13 workspace number $ws4
bindcode Mod4+14 workspace number $ws5
bindcode Mod4+15 workspace number $ws6
bindcode Mod4+16 workspace number $ws7
bindcode Mod4+17 workspace number $ws8
bindcode Mod4+18 workspace number $ws9
bindcode Mod4+19 workspace number $ws10

# Move focused container to workspace (Alt+Shift+Keycode & Super+Shift+Keycode)
bindcode $mod+Shift+10 move container to workspace number $ws1
bindcode $mod+Shift+11 move container to workspace number $ws2
bindcode $mod+Shift+12 move container to workspace number $ws3
bindcode $mod+Shift+13 move container to workspace number $ws4
bindcode $mod+Shift+14 move container to workspace number $ws5
bindcode $mod+Shift+15 move container to workspace number $ws6
bindcode $mod+Shift+16 move container to workspace number $ws7
bindcode $mod+Shift+17 move container to workspace number $ws8
bindcode $mod+Shift+18 move container to workspace number $ws9
bindcode $mod+Shift+19 move container to workspace number $ws10

bindcode Mod4+Shift+10 move container to workspace number $ws1
bindcode Mod4+Shift+11 move container to workspace number $ws2
bindcode Mod4+Shift+12 move container to workspace number $ws3
bindcode Mod4+Shift+13 move container to workspace number $ws4
bindcode Mod4+Shift+14 move container to workspace number $ws5
bindcode Mod4+Shift+15 move container to workspace number $ws6
bindcode Mod4+Shift+16 move container to workspace number $ws7
bindcode Mod4+Shift+17 move container to workspace number $ws8
bindcode Mod4+Shift+18 move container to workspace number $ws9
bindcode Mod4+Shift+19 move container to workspace number $ws10
