conky.config = {
    alignment = 'middle_middle',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = '#cdd6f4',
    default_outline_color = '#11111b',
    default_shade_color = '#11111b',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=56:weight=bold',
    gap_x = 0,
    gap_y = 0,
    minimum_height = 250,
    minimum_width = 600,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#000000',
    stippled_borders = 0,
    update_interval = 0.1,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false
}

conky.text = [[
${alignc}${if_existing /tmp/conky-color-time.txt}${color ${cat /tmp/conky-color-time.txt}}${else}${color #cba6f7}${endif}${time %H:%M}
${voffset -15}${font JetBrainsMono Nerd Font:size=18:weight=bold}${alignc}${if_existing /tmp/conky-color-date.txt}${color ${cat /tmp/conky-color-date.txt}}${else}${color #89b4fa}${endif}${time %A, %B %d}
${if_existing /tmp/conky-music.txt}${if_match "${cat /tmp/conky-music.txt}" != ""}${voffset 12}${font JetBrainsMono Nerd Font:size=14:weight=bold}${alignc}${if_existing /tmp/conky-color-music.txt}${color ${cat /tmp/conky-color-music.txt}}${else}${color #a6e3a1}${endif}${cat /tmp/conky-music.txt}${endif}${endif}
]]
