local colors_file = os.getenv("HOME") .. "/.config/conky/colors.lua"
local colors = { time = "#f5e0dc", date = "#b4befe", music = "#a6e3a1", shade = "#11111b" }
local f = io.open(colors_file, "r")
if f then
    f:close()
    local ok, res = pcall(dofile, colors_file)
    if ok and type(res) == "table" then
        colors = res
    end
end

conky.config = {
    alignment = 'middle_middle',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = colors.time or '#f5e0dc',
    default_outline_color = colors.shade or '#11111b',
    default_shade_color = colors.shade or '#11111b',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=78:weight=bold',
    gap_x = 0,
    gap_y = 0,
    minimum_height = 320,
    minimum_width = 850,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#000000',
    stippled_borders = 0,
    update_interval = 0.1,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false
}

conky.text = string.format([[
${alignc}${color %s}${time %%H:%%M}
${voffset -18}${font JetBrainsMono Nerd Font:size=24:weight=bold}${alignc}${color %s}${time %%A, %%B %%d}
${if_existing /tmp/conky-music.txt}${if_match "${cat /tmp/conky-music.txt}" != ""}${voffset 16}${font JetBrainsMono Nerd Font:size=18:weight=bold}${alignc}${color %s}${cat /tmp/conky-music.txt}${endif}${endif}
]], colors.time or "#f5e0dc", colors.date or "#b4befe", colors.music or "#a6e3a1")
