bg=#1e1e2e
css="
QWidget {
    background-color: #1e1e2e;
    color: #cdd6f4;
    font-family: 'JetBrainsMono Nerd Font';
}
QMenuBar {
    background-color: #181825;
    color: #cdd6f4;
    border-bottom: 1px solid #313244;
}
QMenuBar::item {
    background-color: transparent;
    padding: 4px 8px;
}
QMenuBar::item:selected {
    background-color: #313244;
    color: #cba6f7;
    border-radius: 4px;
}
QMenu {
    background-color: #1e1e2e;
    color: #cdd6f4;
    border: 1px solid #cba6f7;
    padding: 4px;
}
QMenu::item {
    padding: 6px 20px;
    border-radius: 4px;
}
QMenu::item:selected {
    background-color: #313244;
    color: #cba6f7;
}
QToolBar {
    background-color: #181825;
    border-left: 1px solid #313244;
    spacing: 6px;
    padding: 4px;
}
QToolButton {
    background-color: transparent;
    color: #cdd6f4;
    border-radius: 6px;
    padding: 6px;
    margin: 2px;
}
QToolButton:hover {
    background-color: #313244;
    color: #cba6f7;
}
QToolButton:pressed {
    background-color: #45475a;
}
QScrollBar:vertical {
    background-color: #181825;
    width: 6px;
    margin: 0;
}
QScrollBar::handle:vertical {
    background-color: #45475a;
    border-radius: 3px;
    min-height: 20px;
}
QScrollBar::handle:vertical:hover {
    background-color: #cba6f7;
}
QScrollBar::add-line:vertical, QScrollBar::sub-line:vertical {
    height: 0px;
}
"
