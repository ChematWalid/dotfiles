# ─── TMUX CATPPUCCIN MOCHA CONFIGURATION ───────────────────────────────────
# Edit: $EDITOR ~/.config/tmux/tmux.conf
# Reload: Prefix + r  (or: tmux source ~/.config/tmux/tmux.conf)

# ── Prefix (Ctrl+a and Ctrl+b both work) ───────────────────────────────────
set -g prefix C-a
bind C-a send-prefix

# ── General Settings ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

set -g mouse on                         # Enable mouse (click, scroll, drag resize)
set -s escape-time 0                    # Zero delay on ESC key (crucial for Neovim)
set -g history-limit 50000              # 50,000 lines of scrollback
set -g base-index 1                     # Start window numbering at 1 (matches keyboard 1-9)
setw -g pane-base-index 1               # Start pane numbering at 1
set -g renumber-windows on              # Renumber windows automatically when one is closed
set -g set-clipboard on                 # Use system clipboard
set -g focus-events on                  # Pass focus events to apps like Neovim

# ── Intuitive Window Splits in Current Working Directory ───────────────────
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Vim-like Pane Navigation (h, j, k, l) ──────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane Resizing (Shift + Alt + h/j/k/l or Arrows) ─────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Fast Config Reload ────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 🚀 Tmux config reloaded!"

# ── Catppuccin Mocha Theming ───────────────────────────────────────────────
# Status bar layout
set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left

# Palette
# Base: #1e1e2e, Mantle: #181825, Surface0: #313244, Text: #cdd6f4
# Mauve: #cba6f7, Blue: #89b4fa, Green: #a6e3a1, Peach: #fab387, Red: #f38ba8
set -g status-style "bg=#181825,fg=#cdd6f4"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Status Left: Session badge
set -g status-left-length 50
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] 󰕮 #S #[bg=#181825,fg=#89b4fa] "

# Status Right: Directory, Date & Time
set -g status-right-length 100
set -g status-right "#[bg=#313244,fg=#cdd6f4]  #{b:pane_current_path} #[bg=#cba6f7,fg=#11111b,bold]  %H:%M #[bg=#a6e3a1,fg=#11111b,bold]  %d-%b "

# Window status tabs
set -g window-status-separator " "
set -g window-status-format "#[bg=#313244,fg=#a6adc8] #I:#W "
set -g window-status-current-format "#[bg=#cba6f7,fg=#11111b,bold] #I:#W #[bg=#f38ba8,fg=#11111b,bold]#{?window_zoomed_flag, 󰊓 ,}"

# Messages / Command prompt
set -g message-style "bg=#313244,fg=#cba6f7,bold"
set -g message-command-style "bg=#313244,fg=#89b4fa,bold"
