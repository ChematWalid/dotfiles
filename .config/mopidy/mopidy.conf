[core]
cache_dir = $XDG_CACHE_DIR/mopidy
config_dir = $XDG_CONFIG_DIR/mopidy
data_dir = $XDG_DATA_DIR/mopidy
max_tracklist_length = 10000
restore_state = true

[logging]
verbosity = 0
color = true

[audio]
output = pulsesink server=/run/user/1000/pulse/native

[mpd]
enabled = true
hostname = 127.0.0.1
port = 6601

[http]
enabled = true
hostname = 127.0.0.1
port = 6680
default_app = iris
zeroconf = Mopidy HTTP on $hostname

[iris]
enabled = true
country = US
locale = en_US
snapcast_enabled = false

[mpris]
enabled = true
bus_type = session

[file]
enabled = true
media_dirs =
    $XDG_MUSIC_DIR|Music
    ~/Music|Local Music
show_dotfiles = false
follow_symlinks = true
