# rclone config — add remotes by running: rclone config
# Edit: $EDITOR ~/.config/rclone/rclone.conf
# Docs: https://rclone.org/docs/
#
# Common commands:
#   rclone config          — add/edit remote (Google Drive, Mega, S3, etc.)
#   rclone ls remote:      — list files
#   rclone copy src remote:dest  — copy files
#   rclone sync src remote:dest  — one-way sync (DELETES destination extras)
#   rclone bisync src remote:dest — two-way sync
#   rclone mount remote: ~/mnt/gdrive &  — mount as filesystem

