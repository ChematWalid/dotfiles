# ncspot — Catppuccin Mocha Configuration
use_nerdfont = true
backend = "pulseaudio"
bitrate = 320
volnorm = true
gapless = true
notify = true

# Theme: Catppuccin Mocha
[theme]
background = "#1e1e2e"
primary = "#cdd6f4"
secondary = "#a6adc8"
title = "#cba6f7"
playing = "#a6e3a1"
playing_selected = "#a6e3a1"
playing_bg = "#313244"
highlight = "#f5c2e7"
highlight_bg = "#45475a"
error = "#f38ba8"
error_bg = "#1e1e2e"
statusbar = "#181825"
statusbar_text = "#cdd6f4"
statusbar_progress = "#cba6f7"
cmdline = "#181825"
cmdline_text = "#cdd6f4"
search_match = "#f9e2af"
