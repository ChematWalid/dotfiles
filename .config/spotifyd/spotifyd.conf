[global]
# Spotify daemon configuration
# You can leave username/password commented to use Spotify Connect auto-discovery
# from any Spotify app (phone, desktop, web) on your local network.
# Or fill in your Spotify Premium username and password/token below:
# username = ""
# password = ""

# Audio backend: pulseaudio works directly with PipeWire
backend = "pulseaudio"

# The display name of the device in Spotify Connect
device_name = "Arch-Spotifyd"

# Stream quality: 96, 160, or 320 kbps (requires Spotify Premium for 320)
bitrate = 320

# Volume controller: soft-volume provides software gain control
volume_controller = "softvol"

# Normalise volume between songs
volume_normalization = true
normalisation_pregain = -1.0

# The displayed device type in Spotify Connect
device_type = "computer"

# MPRIS D-Bus support: Enables desktop-music-daemon, Polybar, playerctl, and media keys
use_mpris = true
dbus_type = "session"

# Cache configuration
cache_path = "/home/walid/.cache/spotifyd"
max_cache_size = 1073741824
no_audio_cache = false

# Autoplay similar songs after playback finishes
autoplay = true
