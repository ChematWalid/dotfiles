# vim:ft=kitty
# Catppuccin Mocha — merged: your keybindings + vari-sh full color palette + tab bar

# --- Fonts ---
font_family      family="JetBrainsMono Nerd Font Mono" style="Light"
bold_font        family="JetBrainsMono Nerd Font Mono" style="SemiBold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Light Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="SemiBold Italic"
font_size 12.0

symbol_map U+1F000-U+1FAFF Noto Color Emoji

# --- Window ---
window_padding_width 12
hide_window_decorations no
background_opacity 0.94
dynamic_background_opacity yes

# --- Cursor ---
cursor                  #cba6f7
cursor_text_color       #11111b
cursor_shape            beam
cursor_blink_interval   0.5
cursor_trail            2
cursor_trail_decay      0.05 0.2
cursor_trail_start_threshold 2
cursor_trail_color      #cba6f7

# --- Selection ---
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# --- URL ---
url_color               #f5e0dc
url_style               curly

# --- Colors ---
foreground              #cdd6f4
background              #1e1e2e

# Kitty border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# Tab bar
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Marks
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #cba6f7
color13 #cba6f7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# --- Keybindings ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+v paste_from_clipboard
