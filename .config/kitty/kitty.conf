# vim:ft=kitty
# ══════════════════════════════════════════════════════════════════════════════
# Kitty Master Configuration
# Modularized: Color theme is isolated in theme.conf
# ══════════════════════════════════════════════════════════════════════════════

# --- Theme ---
include theme.conf

# --- Fonts ---
font_family      family="JetBrainsMono Nerd Font Mono" style="Light"
bold_font        family="JetBrainsMono Nerd Font Mono" style="SemiBold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Light Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="SemiBold Italic"
font_size 12.0

symbol_map U+1F000-U+1FAFF Noto Color Emoji

# --- Window ---
window_padding_width 12
hide_window_decorations no
background_opacity 0.94
dynamic_background_opacity yes

# --- Keybindings ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+v paste_from_clipboard

# --- Smooth Scrolling & Physics Navigation ---
scrollback_lines 10000
wheel_scroll_multiplier 2.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 2.0
pixel_scroll yes
momentum_scroll 0.95
scrollback_indicator_opacity 0.8

# Smooth animated keyboard scrolling
map ctrl+shift+up scroll_line_up smooth
map ctrl+shift+down scroll_line_down smooth
map ctrl+shift+k scroll_line_up smooth
map ctrl+shift+j scroll_line_down smooth
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
