# Force software volume mixing for ALSA cards to eliminate hardware codec register
# write stutter/cuts on Realtek ALC898 / Intel HDA chips.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
