# ── modules.ini ───────────────────────────────────────────────────────────────
# Modular Polybar Module Definitions

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-matching = true

format = <label-state> <label-mode>

label-focused = %name%
label-focused-foreground = ${colors.mauve}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.mauve}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding = 1

label-visible = %name%
label-visible-underline = ${colors.surface2}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout> <label-indicator>
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.mauve}

label-layout = %layout%
label-layout-foreground = ${colors.text}

label-indicator-on = "%name%"
label-indicator-on-foreground = ${colors.yellow}
label-indicator-on-capslock = "󰪛"
label-indicator-on-capslock-foreground = ${colors.red}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 1
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.text}

format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.overlay0}
format-muted = <label-muted>
label-muted = "Muted"
label-muted-foreground = ${colors.overlay0}
click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.yellow}
label = %used%
label-foreground = ${colors.text}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%
label-foreground = ${colors.text}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{A1:~/.config/polybar/show-ip.sh:}󰈀 %local_ip%%{A}
label-connected-foreground = ${colors.green}
label-disconnected = 

[module/tray]
type = internal/tray
tray-size = 16px
tray-spacing = 6px
tray-background = ${colors.base}

[module/powermenu]
type = custom/text
format = "%{T4}󰐥%{T-}"
format-foreground = ${colors.red}
format-padding = 1
click-left = /home/walid/.config/rofi/powermenu.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.green}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 750

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.sapphire}
label-mounted = %free%

[module/temperature]
type = internal/temperature
thermal-zone = 0
hwmon-path = /sys/class/hwmon/hwmon1/temp1_input
base-temperature = 20
warn-temperature = 80
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.flamingo}

[module/backlight]
type = internal/xbacklight
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃝
ramp-2 = 󰃠
ramp-foreground = ${colors.yellow}

[module/settings]
type = custom/text
format = "  "
format-foreground = ${colors.overlay2}
click-left = /home/walid/.config/polybar/toggle-modules.sh

[module/mpris-live]
type = custom/script
exec = /home/walid/.config/polybar/mpris-live.sh
tail = true
format-foreground = ${colors.text}

[module/wlan]
type = custom/script
exec = /home/walid/.config/polybar/network-tail.sh
tail = true
click-left = /home/walid/.config/polybar/network-toggle-fast.sh
format-foreground = ${colors.teal}

[module/date]
type = custom/script
exec = /home/walid/.config/polybar/datetime-tail.sh
tail = true
click-left = /home/walid/.config/polybar/datetime-toggle.sh
format-foreground = ${colors.text}

[module/prayer]
type = custom/script
exec = /home/walid/.config/polybar/prayer.sh
interval = 30
click-left = /home/walid/.config/polybar/prayer-popup.sh
format-foreground = ${colors.text}
