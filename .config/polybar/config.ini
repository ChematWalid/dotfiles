# ── config.ini ───────────────────────────────────────────────────────────────
# Modular Polybar Master Configuration
# Colors and module definitions are separated for clean maintenance.

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
width = 100%
height = 28pt
radius = 0
bottom = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt

border-size = 0pt
border-color = ${colors.transparent}

padding-left = 2
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "Noto Color Emoji:scale=10;2"
font-3 = "JetBrainsMono Nerd Font:size=15;3"

# Modules layout
modules-left = i3 settings
modules-center = mpris-live
modules-right = pulseaudio date xkeyboard memory cpu filesystem wlan eth tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false

[settings]
screenchange-reload = true
pseudo-transparency = true
