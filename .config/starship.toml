"$schema" = 'https://starship.rs/config-schema.json'

# Global timeout controls to prevent terminal delay on deep directories & HDD mounts
command_timeout = 1500
scan_timeout = 60

format = """
[](#3B4252)\
$os\
$username\
[](bg:#F4A261 fg:#3B4252)\
$directory\
[](fg:#F4A261 bg:#A6E3A1)\
$git_branch\
$git_status\
[](fg:#A6E3A1 bg:#89B4FA)\
$bun\
$c\
$cmake\
$cpp\
$deno\
$dotnet\
$golang\
$gradle\
$java\
$kotlin\
$lua\
$maven\
$nodejs\
$python\
$rust\
$docker_context\
[](fg:#89B4FA bg:#E8AEB7)\
$time\
[ ](fg:#E8AEB7)\
$line_break\
$character"""

add_newline = false

[os]
disabled = false
style = "bg:#3B4252 fg:#ECEFF4"
format = '[$symbol ]($style)'

[os.symbols]
Arch = "󰣇"
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"
Linux = "󰌽"

[username]
show_always = true
style_user = "bg:#3B4252 fg:#ECEFF4"
style_root = "bg:#3B4252 fg:#BF616A"
format = '[$user]($style)'
disabled = false

[directory]
style = "bg:#F4A261 fg:#1E1E2E"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bg:#A6E3A1 fg:#1E1E2E"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#A6E3A1 fg:#1E1E2E"
format = '[$all_status$ahead_behind ]($style)'
ignore_submodules = true

