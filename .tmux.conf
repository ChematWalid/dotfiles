# Sync terminal size correctly across panes/windows
setw -g aggressive-resize on

# === Catppuccin Mocha Colors & Theme ===
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"

# Window status format
setw -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I:#W "
setw -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message styling
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Status left and right
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[bg=default] "
set -g status-right "#[fg=#cdd6f4,bg=#313244] %Y-%m-%d #[fg=#11111b,bg=#a6e3a1,bold] %H:%M "
