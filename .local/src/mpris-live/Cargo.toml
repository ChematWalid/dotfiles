[package]
name = "mpris-live"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio        = { version = "1", features = ["full"] }
zbus         = { version = "5", default-features = false, features = ["tokio"] }
futures-lite = "2"
anyhow       = "1"
x11rb        = { version = "0.13", features = ["allow-unsafe-code"] }

[profile.release]
opt-level     = 3
lto           = "thin"
strip         = true
codegen-units = 1
