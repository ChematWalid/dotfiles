[package]
name = "rofi-clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "=0.2.31"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
