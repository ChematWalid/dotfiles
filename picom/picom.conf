# Picom compositor — optimized for NVIDIA GT 610 (GF119 / Fermi) on X11
backend = "xrender";
vsync = true;

# Disabling use-damage fixes stuttering on old NVIDIA cards
use-damage = false;

# Opacity
active-opacity = 1.0;
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "94:class_g = 'kitty' && focused",
  "88:class_g = 'kitty' && !focused",
  "94:class_g = 'Alacritty' && focused",
  "88:class_g = 'Alacritty' && !focused",
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'firefox'",
  "95:class_g = 'Rofi'",
  "95:class_g = 'Dunst'"
];

# Fading
fading = true;
fade-delta = 6;
fade-in-step = 0.04;
fade-out-step = 0.04;

# Shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Corners
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# Wintypes
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
