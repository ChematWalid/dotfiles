[general]
live_config_reload = true

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.94

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#11111b"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#11111b"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#11111b"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#11111b"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#11111b"
background = "#a6adc8"

[colors.hints.start]
